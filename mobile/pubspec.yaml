name: help_a_prisoner
description: A Flutter app for help-a-prisoner.

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.0
  go_router: ^14.0.0
  dio: ^5.4.0
  flutter_dotenv: ^5.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.0
  video_player: ^2.8.6
  flutter_paystack_plus: ^2.5.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/splash_video.mp4
    - assets/logos/Dc_Prison_Min_logo.png
    - assets/logos/Dominion_city_logo.png
    - assets/logos/Golden_Heart_logo.jpg
    - assets/logos/help_a_prisoner_logo.png